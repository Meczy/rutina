<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <title>Mi Rutina 💪</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Rutina">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <div class="app">
        <header class="hero">
            <div
                style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start;position:relative;z-index:1">
                <div>
                    <h1>Mi Rutina-DEV 💪</h1>
                    <p>Tu entrenamiento en un solo lugar.</p>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1">
                    <button class="persona-btn" id="personaButton">👤</button>
                    <button class="persona-btn"
                        id="progresoButton">📊 Progreso</button>
                        <button class="main-btn" id="editorButton">✏️
                        Rutina</button>
                </div>
            </div>
            <button class="install-btn" id="installButton" hidden>📲 Instalar app</button>
            <div class="stats">
                <div class="stat"><strong id="totalDays">0</strong>Días</div>
                <div class="stat"><strong id="totalExercises">0</strong>Ejercicios</div>
                <div class="stat"><strong>3 × 10</strong>Base de la rutina</div>
            </div>
        </header>
        <div class="tabs-wrap">
            <div class="tabs" id="tabs"></div>
        </div>
        <main id="content"></main>
        <section class="info-section" id="infoSection"></section>
        <div class="footer-note">Tu progreso y tus cambios se guardan en este navegador.</div>
    </div>
    <div class="modal" id="modal">
        <div class="modal-card">
            <div class="modal-top">
                <div class="modal-title" id="modalTitle">Video</div><button class="close" id="close">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>
    <div class="editor" id="editor">
        <div class="editor-panel">
            <div class="editor-head">
                <h2>Editar rutina</h2><button class="small" id="closeEditor">✕ Cerrar</button>
            </div>
            <div class="toolbar">
                <button class="main-btn" id="addDay">＋ Nuevo día</button><button class="small" id="managePersonas">🧑
                    Personas</button>
                <button class="small" id="exportData">💾 Exportar respaldo</button>
            </div>
            <p style="color:#667085">Selecciona un día, cambia su número y nombre, y arrastra los ejercicios para
                cambiar el orden.</p>
            <div class="editor-tabs" id="editorTabs"></div>
            <div id="editorList"></div>
        </div>
    </div>
    <div class="form-overlay" id="exerciseForm">
        <div class="form-card">
            <h3 id="formTitle">Agregar ejercicio</h3><button type="button" class="small" id="buscarWgerButton">🔎 Buscar
                en librería de ejercicios (wger)</button>
            <div class="wger-preview" id="wgerPreview">
                <div class="wger-thumb" id="wgerThumb"><img id="wgerPreviewImg" alt="Imagen del ejercicio" hidden><svg
                        id="wgerPlaceholderIcon" viewBox="0 0 24 24" width="22" height="22" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                        <circle cx="8.5" cy="9.5" r="1.75" fill="currentColor" stroke="none"></circle>
                        <path d="M21 15.5l-5.5-5.5a2 2 0 0 0-2.8 0L4 19"></path>
                    </svg></div><button type="button" class="small" id="wgerAccionButton">Cargar imagen</button>
            </div>
            <form>
                <div class="field"><label>Ejercicio</label><input id="exerciseName" required></div>
                <div class="field"><label>Series</label><input id="exerciseSeries"></div>
                <div class="field"><label>Repeticiones</label><input id="exerciseReps"></div>
                <div class="field"><label>URL del video (opcional)</label><input id="exerciseUrl"
                        placeholder="https://youtube.com/..."></div>
                <div class="form-actions"><button type="button" class="small"
                        id="cancelExercise">Cancelar</button><button type="submit" class="main-btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>
